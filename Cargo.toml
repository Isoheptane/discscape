[package]
name = "macroimage-optical"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Renders a PNG into a Red Book audio image whose spiral track modulation is visible on the data side of a burned CD"
license = "MIT"
authors = ["Isoheptane"]
readme = "README.md"

[dependencies]
image = "0.25.10"
indicatif = "0.18.6"
rand = "0.10.3"

[profile.release]
opt-level = 2
debug = 1