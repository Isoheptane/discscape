[package]
name = "discscape"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Renders image into visible patterns on the data side of a CD"
license = "MIT"
authors = ["Isoheptane"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"]}
image = "0.25"
indicatif = "0.18"
rand = "0.10"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
thiserror = "2.0.21"

[profile.release]
opt-level = 2
debug = 1
